version: 2
updates:
  # pnpm workspace root — Dependabot understands pnpm-lock.yaml under the npm ecosystem and
  # opens one PR per workspace package group it can safely bump together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /apps/dashboard
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
